name: Release

# Triggers:
#   1. push of a tag matching v*.*.*  → build + attach .vsix to release
#   2. workflow_dispatch (manual)     → useful for re-running against an
#      existing tag without having to delete-and-recreate it
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.3.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build + attach .vsix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck + tests)
        run: |
          npm run typecheck
          npm test

      - name: Package .vsix
        run: npm run package

      - name: Locate .vsix artifact
        id: vsix
        run: |
          file=$(ls diversion-vscode-*.vsix | head -1)
          if [ -z "$file" ]; then
            echo "::error::No .vsix produced"
            exit 1
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      # Robust to "release already exists" — uploads (or re-uploads with
      # --clobber) the artifact when the release is already there, otherwise
      # creates a fresh release with auto-generated notes.
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VSIX: ${{ steps.vsix.outputs.file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading .vsix (overwriting if needed)."
            gh release upload "$TAG" "$VSIX" --clobber
          else
            echo "Creating release $TAG with auto-generated notes."
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              "$VSIX"
          fi
