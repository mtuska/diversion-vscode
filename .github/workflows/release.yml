name: Release

# Triggers:
#   1. push of a tag matching v*.*.*  → build + attach .vsix to release
#   2. workflow_dispatch (manual)     → useful for re-running against an
#      existing tag without having to delete-and-recreate it
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.3.0)'
        required: true
        type: string

permissions:
  contents: write

# Opt into Node.js 24 inside the JavaScript-based actions (checkout,
# setup-node, upload-artifact). The runner will force this in June 2026
# anyway; setting it now removes the deprecation warning and surfaces any
# Node-24-specific incompatibilities early.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release:
    name: Build + attach .vsix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck + tests)
        run: |
          npm run typecheck
          npm test

      - name: Package .vsix
        run: npm run package

      - name: Locate release artifacts
        id: artifacts
        run: |
          vsix=$(ls diversion-vscode-*.vsix | head -1)
          if [ -z "$vsix" ]; then
            echo "::error::No .vsix produced"
            exit 1
          fi
          if [ ! -f out/mcp.js ]; then
            echo "::error::out/mcp.js not produced — vscode:prepublish should have built it"
            exit 1
          fi
          # Rename so the file's purpose is obvious on the GitHub Releases page —
          # "mcp.js" out of context is meaningless. Keep the .js suffix because
          # the file is Node-script bundle (shebang + cjs), not a native binary.
          cp out/mcp.js diversion-mcp.js
          chmod +x diversion-mcp.js
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"
          echo "mcp=diversion-mcp.js" >> "$GITHUB_OUTPUT"

      # Robust to "release already exists" — uploads (or re-uploads with
      # --clobber) artifacts when the release is already there, otherwise
      # creates a fresh release with auto-generated notes.
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VSIX: ${{ steps.artifacts.outputs.vsix }}
          MCP: ${{ steps.artifacts.outputs.mcp }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading artifacts (overwriting if needed)."
            gh release upload "$TAG" "$VSIX" "$MCP" --clobber
          else
            echo "Creating release $TAG with auto-generated notes."
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              "$VSIX" "$MCP"
          fi

      # Publish the standalone MCP server to npm under @mtuska/diversion-mcp,
      # so users can run `npx @mtuska/diversion-mcp` without preinstalling
      # anything. Idempotent on retry: skips silently if the version is
      # already on the registry. No-op (with a warning) if NPM_TOKEN is
      # unset, so contributors can run the workflow without breaking it.
      #
      # We publish from a temp directory that contains only the bundle, a
      # minimal package.json, README, and LICENSE. The bundle is fully
      # self-contained (esbuild inlined the MCP SDK + zod), so the
      # published tarball is tiny and has no runtime dependencies.
      - name: Publish @mtuska/diversion-mcp to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          # GitHub Actions disallows referencing `secrets.*` in step-level
          # `if:` expressions, so the no-token guard lives inside the
          # script. A missing token degrades to a warning, never a fail —
          # contributors who don't have npm publish access can still cut
          # releases.
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN secret is not set — skipping @mtuska/diversion-mcp publish."
            exit 0
          fi

          if [ ! -f out/mcp.js ]; then
            echo "::error::out/mcp.js missing — earlier build step should have produced it"
            exit 1
          fi

          # The published version mirrors the tag, with the leading 'v'
          # stripped. This keeps the npm package version aligned with the
          # GitHub release, which keeps the vsix and the MCP bundle in
          # lockstep — important because they share the same source code.
          VERSION="${TAG#v}"
          PKG_NAME="@mtuska/diversion-mcp"

          # If the version is already published, skip rather than fail —
          # makes manual workflow_dispatch reruns idempotent.
          if npm view "$PKG_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$VERSION is already on npm — skipping publish."
            exit 0
          fi

          stage=$(mktemp -d)
          cp out/mcp.js "$stage/mcp.js"
          chmod +x "$stage/mcp.js"
          cp LICENSE "$stage/LICENSE"

          # Slim README so the npm page makes sense on its own. Keep it
          # short — the source of truth is the main repo's README.
          cat > "$stage/README.md" <<'EOF'
          # @mtuska/diversion-mcp

          Standalone stdio Model Context Protocol server for
          [Diversion](https://www.diversion.dev) (the `dv` CLI). Exposes 39
          Diversion source-control tools — status, diff, log, file history,
          conflict awareness, commit, branch, merge, shelves, locks, etc.
          — to any MCP-aware AI client (Claude Code, Codex, Claude Desktop,
          Cursor, Windsurf).

          See the main project for documentation, source, and issue tracker:
          <https://github.com/mtuska/diversion-vscode>.

          ## Quick start

          ```bash
          # Claude Code
          claude mcp add diversion -- npx -y @mtuska/diversion-mcp

          # Codex (~/.codex/config.toml)
          #   [mcp_servers.diversion]
          #   command = "npx"
          #   args = ["-y", "@mtuska/diversion-mcp"]
          ```

          Requires the `dv` CLI on `$PATH` and the local Diversion agent
          running. Node 18+ on Linux / macOS / Windows.
          EOF

          cat > "$stage/package.json" <<EOF
          {
            "name": "$PKG_NAME",
            "version": "$VERSION",
            "description": "Standalone stdio MCP server for Diversion (dv). Exposes Diversion source-control operations to Claude Code, Codex, Claude Desktop, Cursor, and any other MCP-aware AI client.",
            "bin": { "diversion-mcp": "./mcp.js" },
            "files": ["mcp.js", "README.md", "LICENSE"],
            "engines": { "node": ">=18" },
            "license": "Unlicense",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/mtuska/diversion-vscode.git"
            },
            "homepage": "https://github.com/mtuska/diversion-vscode#readme",
            "bugs": "https://github.com/mtuska/diversion-vscode/issues",
            "keywords": ["mcp", "model-context-protocol", "diversion", "dv", "scm", "source-control", "version-control", "claude", "codex"]
          }
          EOF

          # Write the auth token to a project-local .npmrc rather than
          # using `npm config set` so it never lands in $HOME between jobs.
          # The token-less default registry stays intact for `npm view` above.
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$stage/.npmrc"

          echo "Publishing $PKG_NAME@$VERSION (scoped → public access)…"
          cd "$stage"
          npm publish --access public

      # Guard against accidental publisher/name renames in package.json — the
      # .vsix must match the expected marketplace listing (vars.VSCE_EXTENSION_ID,
      # e.g. "mtuska.diversion-vscode") or we abort before publishing.
      - name: Verify package.json matches expected extension id
        env:
          EXPECTED_ID: ${{ vars.VSCE_EXTENSION_ID }}
        run: |
          if [ -z "$EXPECTED_ID" ]; then
            echo "::error::Repository variable VSCE_EXTENSION_ID is not set (expected e.g. mtuska.diversion-vscode)"
            exit 1
          fi
          actual_id=$(node -p "const p=require('./package.json'); p.publisher + '.' + p.name")
          if [ "$actual_id" != "$EXPECTED_ID" ]; then
            echo "::error::package.json extension id '$actual_id' does not match expected '$EXPECTED_ID'"
            exit 1
          fi
          echo "Confirmed extension id is $actual_id"

      # Publishes the same .vsix that was just attached to the GitHub release.
      # Only runs for tag pushes or manual workflow_dispatch — never PRs, since
      # this workflow has no pull_request trigger.
      #
      # `--allow-proposed-apis` is required because we ship with
      # `enabledApiProposals` set in package.json (scmHistoryProvider for the
      # Source Control Graph, scmActionButton for the big blue commit button).
      # Without it, vsce refuses to publish even though the publisher account
      # is allowlisted on the Marketplace side. Keep this flag in sync with
      # the `enabledApiProposals` array in package.json.
      - name: Publish to VS Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: ${{ steps.artifacts.outputs.vsix }}
        run: npx vsce publish --no-dependencies --packagePath "$VSIX" --allow-proposed-apis scmHistoryProvider scmActionButton
