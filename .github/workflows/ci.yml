name: CI

# Triggers only on PRs (incoming changes that need verifying before merge)
# and on manual dispatch. We deliberately don't run on every push to main —
# the release workflow already runs typecheck + test on each tagged release,
# so per-commit-on-main CI was duplicate work for no extra signal.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Opt into Node.js 24 inside the JavaScript-based actions (checkout,
# setup-node, upload-artifact). The runner will force this in June 2026
# anyway; setting it now removes the deprecation warning and surfaces any
# Node-24-specific incompatibilities early.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Typecheck + Test + Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Package
        run: npm run package

      - name: Upload .vsix as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: diversion-vscode-vsix
          path: '*.vsix'
          retention-days: 14
          if-no-files-found: error
