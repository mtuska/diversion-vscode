name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck + Test + Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Package
        run: npm run package

      - name: Upload .vsix as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: diversion-vscode-vsix
          path: '*.vsix'
          retention-days: 14
          if-no-files-found: error
